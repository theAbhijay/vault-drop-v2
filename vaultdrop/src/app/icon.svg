<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Apple Spectral Gradient -->
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3" />
      <stop offset="30%" stop-color="#5856D6" />
      <stop offset="55%" stop-color="#AF52DE" />
      <stop offset="75%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- Dark Glass Base Gradient -->
    <linearGradient id="glassBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#090B0F" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glassBase)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Chromatic Glowing Outer Shield Accent -->
  <path 
    d="M32 10 L48 17 V30 C48 40.5 41.5 48.5 32 53 C22.5 48.5 16 40.5 16 30 V17 Z" 
    fill="none" 
    stroke="url(#appleGradient)" 
    stroke-width="3" 
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Subtle Shield Inner Fill -->
  <path 
    d="M32 12.5 L45.5 18.5 V30 C45.5 39 40 46 32 50 C24 46 18.5 39 18.5 30 V18.5 Z" 
    fill="url(#appleGradient)" 
    fill-opacity="0.12" 
  />

  <!-- Center "Drop" & Vault Core Symbol -->
  <!-- Upper Droplet / Shield Heart -->
  <path 
    d="M32 20 C27 26 25 29 25 33 C25 37 28 40 32 40 C36 40 39 37 39 33 C39 29 37 26 32 20 Z" 
    fill="url(#appleGradient)" 
  />

  <!-- Keyhole Core / Vault Latch -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />
  <path d="M30.5 33.5 H33.5 L34 37 H30 Z" fill="#FFFFFF" />
</svg>
